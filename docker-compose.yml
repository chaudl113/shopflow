# `docker compose up --build` runs the whole system:
#   app  http://localhost:5201  (API + built web app in one container)
#   db   localhost:5442         (Postgres 16; also used by `npm test` and local dev)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    ports:
      - "5442:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopflow -d shopflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://shopflow:shopflow@db:5432/shopflow
      # Demo-only default so the stack starts without setup; set JWT_SECRET in .env for anything real.
      JWT_SECRET: ${JWT_SECRET:-demo-only-not-a-secret-change-me}
      SEED_DEMO: if-empty
      DEMO_PUBLIC: ${DEMO_PUBLIC:-0}
    ports:
      - "5201:3201"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  dbdata:
